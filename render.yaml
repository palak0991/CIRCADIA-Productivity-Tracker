services:
  # ── 1. Python Analytics & NLP Microservice ──────────────────────────────
  - type: web
    name: circadia-python-analytics
    env: python
    rootDir: python-analytics
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    plan: free

  # ── 2. Spring Boot Backend Service ──────────────────────────────────────
  - type: web
    name: circadia-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: circadia-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: circadia-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: circadia-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: circadia-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: circadia-db
          property: password
      - key: DB_URL
        fromDatabase:
          name: circadia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_ANALYTICS_URL
        fromService:
          type: web
          name: circadia-python-analytics
          property: host
      - key: FRONTEND_URL
        value: https://circadia-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://circadia-frontend.onrender.com,http://localhost:5173

  # ── 3. React Frontend ───────────────────────────────────────────────────
  - type: web
    name: circadia-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://circadia-backend.onrender.com/api
      - key: VITE_API_BASE_URL
        value: https://circadia-backend.onrender.com/api

databases:
  # ── Managed PostgreSQL Database ─────────────────────────────────────────
  - name: circadia-db
    plan: free
    databaseName: visualizer24
    user: postgres
